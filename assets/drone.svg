<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="VigilIA drone — diagrama técnico vista superior">
  <title>VigilIA — Diagrama Técnico Vista Superior</title>

  <!-- Background -->
  <rect width="480" height="300" fill="#000a00"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="techgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0L0 0 0 32" fill="none" stroke="rgba(0,51,0,0.22)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="480" height="300" fill="url(#techgrid)"/>

  <!-- ===== MAIN WINGS ===== -->
  <!-- Left wing -->
  <polygon
    points="236,142 236,154 30,148 24,134"
    fill="rgba(0,255,65,0.05)" stroke="#00ff41" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right wing -->
  <polygon
    points="244,142 244,154 450,148 456,134"
    fill="rgba(0,255,65,0.05)" stroke="#00ff41" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Solar cell dividers — left wing -->
  <line x1="60"  y1="135" x2="58"  y2="147" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>
  <line x1="90"  y1="136" x2="88"  y2="147" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>
  <line x1="120" y1="137" x2="118" y2="148" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>
  <line x1="150" y1="138" x2="148" y2="149" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>
  <line x1="180" y1="139" x2="178" y2="150" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>
  <line x1="210" y1="140" x2="208" y2="152" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>

  <!-- Solar cell dividers — right wing -->
  <line x1="420" y1="135" x2="422" y2="147" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>
  <line x1="390" y1="136" x2="392" y2="147" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>
  <line x1="360" y1="137" x2="362" y2="148" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>
  <line x1="330" y1="138" x2="332" y2="149" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>
  <line x1="300" y1="139" x2="302" y2="150" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>
  <line x1="270" y1="140" x2="272" y2="152" stroke="#00cc33" stroke-width="0.8" opacity="0.65"/>

  <!-- ===== VTOL BOOM ARMS (retractable, shown folded rearward) ===== -->
  <!-- Front-left boom -->
  <line x1="234" y1="132" x2="194" y2="110" stroke="#00ff41" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
  <circle cx="194" cy="110" r="10" fill="rgba(0,255,65,0.04)" stroke="#00ff41" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="194" cy="110" r="3"  fill="#00ff41" opacity="0.9"/>

  <!-- Rear-left boom -->
  <line x1="234" y1="160" x2="194" y2="182" stroke="#00ff41" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
  <circle cx="194" cy="182" r="10" fill="rgba(0,255,65,0.04)" stroke="#00ff41" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="194" cy="182" r="3"  fill="#00ff41" opacity="0.9"/>

  <!-- Front-right boom -->
  <line x1="246" y1="132" x2="286" y2="110" stroke="#00ff41" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
  <circle cx="286" cy="110" r="10" fill="rgba(0,255,65,0.04)" stroke="#00ff41" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="286" cy="110" r="3"  fill="#00ff41" opacity="0.9"/>

  <!-- Rear-right boom -->
  <line x1="246" y1="160" x2="286" y2="182" stroke="#00ff41" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
  <circle cx="286" cy="182" r="10" fill="rgba(0,255,65,0.04)" stroke="#00ff41" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="286" cy="182" r="3"  fill="#00ff41" opacity="0.9"/>

  <!-- ===== V-TAIL ===== -->
  <polygon
    points="237,218 200,258 234,228"
    fill="rgba(0,255,65,0.05)" stroke="#00ff41" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon
    points="243,218 280,258 246,228"
    fill="rgba(0,255,65,0.05)" stroke="#00ff41" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- ===== PUSHER MOTOR ===== -->
  <circle cx="240" cy="232" r="14" fill="rgba(0,204,51,0.06)" stroke="#00cc33" stroke-width="1.5"/>
  <circle cx="240" cy="232" r="7"  fill="none" stroke="#00cc33" stroke-width="1"/>
  <circle cx="240" cy="232" r="2"  fill="#00cc33"/>

  <!-- ===== FUSELAGE ===== -->
  <ellipse cx="240" cy="152" rx="13" ry="88"
    fill="rgba(0,255,65,0.04)" stroke="#00ff41" stroke-width="1.8"/>

  <!-- Nose tip -->
  <path d="M228,66 L240,48 L252,66 Z"
    fill="rgba(0,255,65,0.15)" stroke="#00ff41" stroke-width="1.2"/>

  <!-- ===== CAMERA/GIMBAL POD ===== -->
  <ellipse cx="240" cy="138" rx="9" ry="10"
    fill="rgba(0,255,65,0.08)" stroke="#00ff41" stroke-width="1.2"/>
  <circle cx="240" cy="138" r="4" fill="rgba(0,255,65,0.1)" stroke="#00ff41" stroke-width="1"/>
  <circle cx="240" cy="138" r="1.5" fill="#00ff41"/>

  <!-- ===== DIMENSION ANNOTATIONS ===== -->
  <!-- Wingspan bar -->
  <line x1="24"  y1="270" x2="456" y2="270" stroke="rgba(0,80,0,0.6)" stroke-width="0.8"/>
  <line x1="24"  y1="265" x2="24"  y2="275" stroke="rgba(0,80,0,0.6)" stroke-width="0.8"/>
  <line x1="456" y1="265" x2="456" y2="275" stroke="rgba(0,80,0,0.6)" stroke-width="0.8"/>
  <text x="240" y="285" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#004400" letter-spacing="2">ENVERGADURA 2,8m</text>

  <!-- ===== HEADER LABEL ===== -->
  <text x="240" y="16" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="8" fill="#004400" letter-spacing="3">
    VIGILIA · DIAGRAMA TÉCNICO · VISTA SUPERIOR
  </text>

  <!-- Spec labels -->
  <text x="12" y="40"  font-family="'Courier New',monospace" font-size="7" fill="#003300">MTOW 7kg</text>
  <text x="12" y="52"  font-family="'Courier New',monospace" font-size="7" fill="#003300">NACA 4415</text>
  <text x="390" y="40" font-family="'Courier New',monospace" font-size="7" fill="#003300">96W SOLAR</text>
  <text x="390" y="52" font-family="'Courier New',monospace" font-size="7" fill="#003300">4h ENDURANCE</text>

  <!-- VTOL motor labels -->
  <text x="155" y="108" font-family="'Courier New',monospace" font-size="7" fill="#003300" text-anchor="end">MN3110</text>
  <text x="325" y="108" font-family="'Courier New',monospace" font-size="7" fill="#003300">MN3110</text>
</svg>
